<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Article App</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4 text-primary">Create a New Article</h1>
        <form id="articleForm">
            <div class="form-group">
                <label for="title" class="font-weight-bold">Title:</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>
            <div class="form-group">
                <label for="author" class="font-weight-bold">Author:</label>
                <input type="text" class="form-control" id="author" name="author" required>
            </div>
            <div class="form-group">
                <label for="content" class="font-weight-bold">Content:</label>
                <textarea class="form-control" id="content" name="content" rows="8" required></textarea>
            </div>
            <div class="form-group">
                <label for="image" class="font-weight-bold">Image:</label>
                <input type="file" class="form-control-file" id="image" name="image" accept="image/*">
                <div id="imagePreview" class="mt-2"></div>
            </div>
            <button type="submit" class="btn btn-success btn-block">Submit Article</button>
        </form>

        <h2 class="mt-5 mb-3 text-info text-center">Submitted Articles</h2>
        <div id="articlesDisplay">
            <p class="text-muted text-center">No articles submitted yet.</p>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
